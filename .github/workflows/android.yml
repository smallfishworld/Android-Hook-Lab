name: Android Hook Lab Mobile
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and package standalone Android APK
        run: |
          gradle --no-daemon :libs:protocol:test :apps:android:testDebugUnitTest :apps:android:assembleDebug :apps:android:lintDebug
      - name: Validate modern Xposed metadata
        run: |
          unzip -l apps/android/build/outputs/apk/debug/android-debug.apk | grep -F 'META-INF/xposed/java_init.list'
          unzip -l apps/android/build/outputs/apk/debug/android-debug.apk | grep -F 'META-INF/xposed/module.prop'
          unzip -p apps/android/build/outputs/apk/debug/android-debug.apk META-INF/xposed/module.prop | grep -F 'staticScope=false'
      - uses: actions/upload-artifact@v4
        with:
          name: hook-lab-v0.4-mobile
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
