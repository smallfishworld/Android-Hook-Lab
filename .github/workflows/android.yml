name: Android M0 Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and debug builds
        run: |
          gradle --no-daemon :libs:protocol:test :samples:demo-app:testDebugUnitTest :apps:android:testDebugUnitTest :apps:android:assembleDebug :samples:demo-app:assembleDebug
      - name: Check modern Xposed entry metadata
        run: |
          unzip -l apps/android/build/outputs/apk/debug/android-debug.apk | grep -F 'META-INF/xposed/java_init.list'
          unzip -l apps/android/build/outputs/apk/debug/android-debug.apk | grep -F 'META-INF/xposed/scope.list'
          unzip -l apps/android/build/outputs/apk/debug/android-debug.apk | grep -F 'META-INF/xposed/module.prop'
      - uses: actions/upload-artifact@v4
        with:
          name: hook-lab-m0-debug-apks
          path: |
            apps/android/build/outputs/apk/debug/*.apk
            samples/demo-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
